name: Container entrypoint and multi-arch

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-entrypoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entrypoint-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify wrapper syntax and exit propagation
        shell: bash
        run: |
          set -euo pipefail
          sh -n docker/entrypoint.sh
          test "$(sh docker/entrypoint.sh sh -c 'printf ok')" = "ok"
          set +e
          sh docker/entrypoint.sh sh -c 'exit 23'
          status=$?
          set -e
          test "$status" -eq 23

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --progress=plain --file docker/Dockerfile --tag zed-oci:ci .
      - name: Verify image execution metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect zed-oci:ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/entrypoint.sh"]'
          test "$(docker image inspect zed-oci:ci --format '{{json .Config.Cmd}}')" = '["/usr/local/bin/zed","--help"]'

  buildx-multiarch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 and arm64 OCI image
        run: |
          docker buildx build \
            --file docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --progress=plain \
            --output type=oci,dest=/tmp/zed-oci.oci.tar \
            .
          test -s /tmp/zed-oci.oci.tar
